name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build (if package.json)
        id: build
        run: |
          if [ -f package.json ]; then
            npm ci --omit=dev
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi

      - name: Prepare publish directory
        id: prepare
        run: |
          set -e
          SITE_DIR="$RUNNER_TEMP/site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          if [ -d dist ]; then
            cp -r dist/. "$SITE_DIR/"
          elif [ -d build ]; then
            cp -r build/. "$SITE_DIR/"
          elif [ -d public ]; then
            cp -r public/. "$SITE_DIR/"
          else
            git archive HEAD | tar -x -C "$SITE_DIR"
            rm -f "$SITE_DIR/CLAUDE.md" "$SITE_DIR/errores-y-correcciones.md"
          fi
          echo "site_dir=$SITE_DIR" >> $GITHUB_OUTPUT

      - name: Assert internal docs are absent from staging dir
        run: |
          echo "site_dir resuelto: '${{ steps.prepare.outputs.site_dir }}'"
          ls -la "${{ steps.prepare.outputs.site_dir }}" | head -20
          if [ -f "${{ steps.prepare.outputs.site_dir }}/CLAUDE.md" ]; then
            echo "::error::CLAUDE.md SIGUE en el directorio de staging, algo falló arriba"
            exit 1
          fi
          echo "OK: CLAUDE.md ausente del staging"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.site_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
